version: "3.9"

services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    command:
      - --model
      - meta-llama/Llama-3.2-3B-Instruct
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.90"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    networks:
      - demo-net

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - demo-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - vllm
      - dcgm-exporter
    networks:
      - demo-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=demo
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/noisy-neighbour.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - demo-net

  load-generator:
    build: ./load-generator
    ports:
      - "8080:8080"
    environment:
      - VLLM_BASE_URL=http://vllm:8000
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - demo-net

volumes:
  model-cache:

networks:
  demo-net:
    driver: bridge
